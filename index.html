    <!-- Подключаем Tailwind CSS для стилей -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Подключаем иконки Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        .hide-scrollbars::-webkit-scrollbar { display: none; }
        .hide-scrollbars { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        @keyframes fadeInUp { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .animate-fade-in-up { animation: fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24 md:pb-8 selection:bg-emerald-200 min-h-screen flex flex-col">

    <!-- Шапка -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-3">
            <div class="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center text-white shadow-sm">
                <i class="ph-bold ph-package text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800">Учёт комплектующих</h1>
        </div>
    </header>

    <!-- Основной контент (Контейнеры вкладок) -->
    <main class="max-w-6xl mx-auto px-4 py-6 md:py-8 w-full flex-1">
        
        <!-- Напоминание о бэкапе (появляется только если есть несохраненные изменения) -->
        <div id="backup-reminder" class="hidden mb-6 bg-amber-50 border border-amber-200 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-sm animate-fade-in">
            <div class="flex items-center gap-4 text-amber-900">
                <div class="p-2 bg-amber-100 rounded-full text-amber-600 shrink-0">
                    <i class="ph-bold ph-warning-circle text-2xl"></i>
                </div>
                <div>
                    <div class="font-bold text-base">Не забудьте сохранить копию!</div>
                    <div class="text-sm opacity-90">Вы внесли изменения. Рекомендуем скачать свежий резервный файл.</div>
                </div>
            </div>
            <div class="flex gap-2 w-full sm:w-auto shrink-0">
                <button onclick="exportData()" class="flex-1 sm:flex-none px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2"><i class="ph-bold ph-download-simple text-lg"></i> Скачать</button>
                <button onclick="dismissBackupReminder()" class="p-2.5 text-amber-700 hover:bg-amber-200 bg-amber-100 rounded-xl transition-colors flex items-center justify-center"><i class="ph-bold ph-x text-lg"></i></button>
            </div>
        </div>

        <section id="tab-home" class="tab-content"></section>
        <section id="tab-parts" class="tab-content hidden"></section>
        <section id="tab-purchases" class="tab-content hidden"></section>
        <section id="tab-sets" class="tab-content hidden"></section>
        <section id="tab-builds" class="tab-content hidden"></section>
        <section id="tab-history" class="tab-content hidden"></section>
        <section id="tab-settings" class="tab-content hidden"></section>
    </main>

    <!-- Нижняя навигация -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 pb-safe md:relative md:bg-transparent md:border-0 md:pb-0 z-40">
        <div class="max-w-6xl mx-auto px-2 py-2 flex overflow-x-auto gap-1 hide-scrollbars md:justify-center" id="main-nav">
            <!-- Кнопки навигации генерируются в JS -->
        </div>
    </nav>

    <!-- Уведомления (Toast) -->
    <div id="toast-container" class="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 hidden">
        <div class="bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 font-medium">
            <i class="ph-bold ph-check text-emerald-400 text-lg"></i>
            <span id="toast-message">Успешно!</span>
        </div>
    </div>

    <!-- Модальное окно (Универсальное) -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden animate-fade-in">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto flex flex-col">
            <div class="sticky top-0 bg-white/90 backdrop-blur pb-2 pt-5 px-6 border-b border-slate-100 flex justify-between items-center z-10">
                <h3 id="modal-title" class="text-xl font-bold text-slate-800">Заголовок</h3>
                <button onclick="closeModal()" class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors">
                    <i class="ph-bold ph-x text-lg"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6">
                <!-- Контент модального окна -->
            </div>
        </div>
    </div>

    <!-- Модальное окно (Подтверждение) -->
    <div id="confirm-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[60] hidden animate-fade-in">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
            <div class="p-6 text-center">
                <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4">
                    <i class="ph-bold ph-warning text-2xl"></i>
                </div>
                <h3 id="confirm-title" class="text-lg font-bold text-slate-800 mb-2">Подтвердите действие</h3>
                <p id="confirm-message" class="text-sm text-slate-500 mb-6">Вы уверены?</p>
                <div class="flex gap-3">
                    <button onclick="closeConfirm(false)" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold transition-colors">Отмена</button>
                    <button id="confirm-btn-yes" class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-semibold transition-colors">Подтвердить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'pinata_stock_app_v2';
        
        let data = { parts: [], sets: [], history: [] };
        let activeTab = 'home';
        let searchQuery = '';
        let historyFilter = 'all';
        let needsBackup = localStorage.getItem(STORAGE_KEY + '_needs_backup') === 'true';

        const generateId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const getToday = () => new Date().toISOString().slice(0, 10);
        const parseNum = (v) => Number(v) || 0;
        const formatMoney = (v) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB' }).format(parseNum(v));
        const formatQty = (v) => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 3 }).format(parseNum(v));
        const escapeHTML = (str) => String(str ?? '').replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match]));

        const getPart = (id) => data.parts.find(p => p.id === id);
        const getUnitCost = (p) => p && parseNum(p.stock) > 0 ? parseNum(p.value) / parseNum(p.stock) : parseNum(p?.cost);
        const getRecipeCost = (setObj) => (setObj?.items || []).reduce((sum, item) => sum + parseNum(item.qty) * getUnitCost(getPart(item.partId)), 0);
        
        const checkAvailability = (setObj, buildQty = 1) => {
            if (!setObj || !setObj.items) return [];
            return setObj.items.map(it => {
                const p = getPart(it.partId);
                const needed = parseNum(it.qty) * buildQty;
                const have = parseNum(p?.stock);
                return { part: p, needed, have, isOk: !!p && (have + 1e-9 >= needed) };
            });
        };

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    data = {
                        parts: Array.isArray(parsed.parts) ? parsed.parts : [],
                        sets: Array.isArray(parsed.sets) ? parsed.sets : [],
                        history: Array.isArray(parsed.history) ? parsed.history : []
                    };
                }
            } catch (e) {
                console.error('Ошибка загрузки', e);
            }
        }

        function saveData() { 
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); 
            setNeedsBackup(true); // Включаем напоминалку при любом сохранении
        }

        function setNeedsBackup(status) {
            needsBackup = status;
            localStorage.setItem(STORAGE_KEY + '_needs_backup', status);
            const reminder = document.getElementById('backup-reminder');
            if (status) {
                reminder.classList.remove('hidden');
            } else {
                reminder.classList.add('hidden');
            }
        }

        function dismissBackupReminder() {
            document.getElementById('backup-reminder').classList.add('hidden');
        }

        let toastTimeout;
        function showToast(message) {
            const container = document.getElementById('toast-container');
            document.getElementById('toast-message').textContent = message;
            container.classList.remove('hidden');
            container.classList.add('animate-fade-in-up');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => container.classList.add('hidden'), 3000);
        }

        function openModal(title, htmlContent) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = htmlContent;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-body').innerHTML = '';
        }

        let confirmCallback = null;
        function showConfirm(title, message, callback) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            confirmCallback = callback;
            document.getElementById('confirm-overlay').classList.remove('hidden');
            document.getElementById('confirm-btn-yes').onclick = () => closeConfirm(true);
        }

        function closeConfirm(result) {
            document.getElementById('confirm-overlay').classList.add('hidden');
            if (result && confirmCallback) confirmCallback();
            confirmCallback = null;
        }

        const TABS = [
            { id: 'home', icon: 'ph-trend-up', label: 'Обзор' },
            { id: 'parts', icon: 'ph-box-cube', label: 'Склад' },
            { id: 'purchases', icon: 'ph-shopping-cart', label: 'Поступления' },
            { id: 'sets', icon: 'ph-package', label: 'Рецептуры' },
            { id: 'builds', icon: 'ph-wrench', label: 'Сборка' },
            { id: 'history', icon: 'ph-clock-counter-clockwise', label: 'История' },
            { id: 'settings', icon: 'ph-gear', label: 'Данные' }
        ];

        function switchTab(tabId) {
            activeTab = tabId;
            const nav = document.getElementById('main-nav');
            nav.innerHTML = TABS.map(tab => {
                const isActive = activeTab === tab.id;
                return `
                    <button onclick="switchTab('${tab.id}')" class="flex flex-col md:flex-row items-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-3 rounded-xl min-w-[72px] md:min-w-0 transition-all ${isActive ? 'text-emerald-700 bg-emerald-50 font-bold' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-800 font-medium'}">
                        <i class="ph-bold ${tab.icon} ${isActive ? 'text-[22px]' : 'text-[20px]'}"></i>
                        <span class="text-[10px] md:text-sm">${tab.label}</span>
                    </button>
                `;
            }).join('');

            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            window.scrollTo(0, 0);
            renderApp();
        }

        function renderApp() {
            if (activeTab === 'home') renderDashboard();
            if (activeTab === 'parts') renderParts();
            if (activeTab === 'purchases') renderPurchases();
            if (activeTab === 'sets') renderSets();
            if (activeTab === 'builds') renderBuilds();
            if (activeTab === 'history') renderHistory();
            if (activeTab === 'settings') renderSettings();
        }

        function renderDashboard() {
            const totalValue = data.parts.reduce((sum, p) => sum + parseNum(p.value), 0);
            const lowStockParts = data.parts.filter(p => parseNum(p.stock) <= parseNum(p.minStock));
            const buildsCount = data.history.filter(h => h.type === 'build').length;

            let html = `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
                            <div class="flex items-center gap-3 text-emerald-600 mb-2">
                                <div class="p-2 bg-emerald-50 rounded-lg"><i class="ph-bold ph-box-cube text-xl"></i></div>
                                <span class="font-semibold">Комплектующих</span>
                            </div>
                            <div class="text-3xl font-bold text-slate-800">${data.parts.length}</div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
                            <div class="flex items-center gap-3 text-blue-600 mb-2">
                                <div class="p-2 bg-blue-50 rounded-lg"><i class="ph-bold ph-currency-ruble text-xl"></i></div>
                                <span class="font-semibold">Сумма на складе</span>
                            </div>
                            <div class="text-3xl font-bold text-slate-800">${formatMoney(totalValue)}</div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
                            <div class="flex items-center gap-3 text-purple-600 mb-2">
                                <div class="p-2 bg-purple-50 rounded-lg"><i class="ph-bold ph-package text-xl"></i></div>
                                <span class="font-semibold">Рецептур</span>
                            </div>
                            <div class="text-3xl font-bold text-slate-800">${data.sets.length}</div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
                            <div class="flex items-center gap-3 text-orange-600 mb-2">
                                <div class="p-2 bg-orange-50 rounded-lg"><i class="ph-bold ph-wrench text-xl"></i></div>
                                <span class="font-semibold">Сборок</span>
                            </div>
                            <div class="text-3xl font-bold text-slate-800">${buildsCount}</div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                <i class="ph-fill ph-warning-circle text-amber-500 text-xl"></i>
                                Требуют внимания (мало на складе)
                            </h2>
                            <button onclick="switchTab('parts')" class="text-sm text-emerald-600 font-semibold hover:underline">Все комплектующие →</button>
                        </div>
            `;

            if (lowStockParts.length === 0) {
                html += `<div class="text-center py-8 text-slate-500 bg-slate-50 rounded-xl border border-dashed border-slate-200">Всё в порядке! Нет комплектующих с критическим остатком.</div>`;
            } else {
                html += `<div class="grid gap-3">`;
                lowStockParts.forEach(p => {
                    const percent = p.minStock > 0 ? Math.min(100, (p.stock / p.minStock) * 100) : 0;
                    const isZero = p.stock <= 0;
                    html += `
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl">
                            <div class="flex-1 mr-4">
                                <div class="font-semibold text-slate-800">${escapeHTML(p.name)}</div>
                                <div class="text-sm text-slate-500 mb-2">Остаток: ${formatQty(p.stock)} ${escapeHTML(p.unit)} (Мин: ${formatQty(p.minStock)})</div>
                                <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full ${isZero ? 'bg-red-500' : 'bg-amber-500'}" style="width: ${percent}%"></div>
                                </div>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${isZero ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}">${isZero ? 'Нет в наличии' : 'Заканчивается'}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            html += `</div></div>`;
            document.getElementById('tab-home').innerHTML = html;
        }

        let currentEditingPart = null;

        function renderParts() {
            const filtered = data.parts.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
            
            let html = `
                <div class="space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between gap-4 items-start sm:items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div class="relative flex-1 w-full max-w-md">
                            <input type="text" id="parts-search" placeholder="Поиск комплектующих..." class="w-full pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all" value="${escapeHTML(searchQuery)}">
                        </div>
                        <button onclick="openPartForm()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-semibold flex items-center justify-center gap-2 shadow-sm shadow-emerald-600/20 transition-all">
                            <i class="ph-bold ph-plus text-lg"></i> Добавить деталь
                        </button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            `;

            if (filtered.length === 0) {
                html += `<div class="col-span-full py-12 text-center text-slate-500 bg-white rounded-2xl border border-dashed border-slate-200">${searchQuery ? 'Ничего не найдено по запросу.' : 'Список комплектующих пуст. Добавьте первую деталь.'}</div>`;
            } else {
                filtered.forEach(p => {
                    const isZero = p.stock === 0;
                    const badgeClass = isZero ? 'bg-red-100 text-red-700' : (p.stock <= p.minStock ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700');
                    html += `

        function savePart() {

            const availability = checkAvailability(setObj, qty), canBuild = availability.length > 0 && availability.every(i => i.isOk), costPerSet = getRecipeCost(setObj);
            container.innerHTML = `<h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="ph-bold ph-info text-slate-400 text-lg"></i> Проверка остатков</h3><div class="space-y-4 flex-1"><div class="space-y-2">${availability.map(req => `<div class="flex justify-between items-center text-sm bg-white p-3 rounded-lg border border-slate-100"><div class="flex-1"><div class="font-medium text-slate-800">${escapeHTML(req.part?.name || 'Неизвестно')}</div><div class="text-xs text-slate-500">Надо: ${formatQty(req.needed)} / Есть: ${formatQty(req.have)}</div></div><div class="ml-2 flex-shrink-0 ${req.isOk ? 'text-emerald-500' : 'text-red-500 font-bold bg-red-50 px-2 py-1 rounded-md'}">${req.isOk ? '<i class="ph-bold ph-check text-lg"></i>' : 'Мало'}</div></div>`).join('')}</div><div class="mt-auto pt-4 border-t border-slate-200"><div class="flex justify-between text-sm text-slate-600 mb-1"><span>Себестоимость 1 шт:</span> <span class="font-medium">${formatMoney(costPerSet)}</span></div><div class="flex justify-between text-lg font-bold text-slate-800"><span>Итого к списанию:</span> <span>${formatMoney(costPerSet * qty)}</span></div></div></div>`;
            btn.disabled = !canBuild; btn.className = `w-full py-4 rounded-xl font-bold text-lg shadow-sm transition-all mt-4 flex justify-center items-center gap-2 ${canBuild ? 'bg-orange-500 hover:bg-orange-600 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`;
        }

        function doBuild() {
            const setObj = data.sets.find(s => s.id === document.getElementById('build-set').value), qty = Math.max(1, Math.floor(parseNum(document.getElementById('build-qty').value)));
            const availability = checkAvailability(setObj, qty); if (!setObj || !availability.every(i => i.isOk)) return showToast('Невозможно собрать!');
            let snapshots = [];
            for (const req of availability) {
                const pIndex = data.parts.findIndex(p => p.id === req.part.id);
                if (pIndex > -1) {
                    const p = data.parts[pIndex], oldStock = parseNum(p.stock), oldValue = parseNum(p.value), newStock = Math.max(0, oldStock - req.needed), newValue = oldStock > 0 ? oldValue * (newStock / oldStock) : 0, unitCost = getUnitCost(p);
                    snapshots.push({ partId: p.id, partName: p.name, unit: p.unit || 'шт.', qtyPerSet: req.needed / qty, qtyTotal: req.needed, unitCost: unitCost, lineCost: req.needed * unitCost });
                    data.parts[pIndex] = { ...p, stock: newStock, value: newValue, cost: newStock > 0 ? newValue / newStock : unitCost };
                }
            }
            const actualUnitCost = snapshots.reduce((sum, s) => sum + s.qtyPerSet * s.unitCost, 0);
            data.history.unshift({ id: generateId(), type: 'build', date: document.getElementById('build-date').value || getToday(), setId: setObj.id, setName: setObj.name, qty: qty, unitCost: actualUnitCost, total: actualUnitCost * qty, snapshots, createdAt: new Date().toISOString() });
            saveData(); renderBuilds(); showToast('Успешно собрано!');
        }

        // ==========================================
        // НОВЫЕ ФУНКЦИИ ДЛЯ РЕДАКТИРОВАНИЯ ИСТОРИИ
        // ==========================================
        function editPurchase(id) {
            const item = data.history.find(h => h.id === id);
            if (!item || item.type !== 'purchase') return;
            
            let html = `
                <div class="space-y-4">
                    <div class="bg-slate-50 p-3 rounded-xl mb-2 text-sm text-slate-600">
                        Поступление детали: <span class="font-bold text-slate-800">${escapeHTML(item.partName)}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Количество</label>
                            <input type="number" id="ep-qty" min="0.001" step="any" value="${item.qty}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/20">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Цена за ед., ₽</label>
                            <input type="number" id="ep-price" min="0" step="any" value="${item.price}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/20">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Дата</label>
                        <input type="date" id="ep-date" value="${item.date}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/20">
                    </div>
                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-100 text-sm text-amber-800 flex items-start gap-2 mt-4">
                        <i class="ph-bold ph-warning text-base mt-0.5 shrink-0"></i>
                        <span>При сохранении остатки на складе и средняя себестоимость будут автоматически пересчитаны.</span>
                    </div>
                    <button onclick="savePurchaseEdit('${id}')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-lg shadow-sm transition-colors mt-2">Сохранить изменения</button>
                </div>
            `;
            openModal('Изменить закупку', html);
        }

        function savePurchaseEdit(id) {
            const item = data.history.find(h => h.id === id);
            if (!item) return;
            const p = getPart(item.partId);
            
            const newQty = parseNum(document.getElementById('ep-qty').value);
            const newPrice = parseNum(document.getElementById('ep-price').value);
            const newDate = document.getElementById('ep-date').value;

            if (newQty <= 0 || newPrice < 0 || !newDate) return showToast('Заполните данные корректно');

            if (p) {
                // Октатываем влияние старой закупки
                let currentStock = parseNum(p.stock) - parseNum(item.qty);
                let currentValue = parseNum(p.value) - parseNum(item.total);

                // Применяем новую закупку
                const newTotal = newQty * newPrice;
                p.stock = Math.max(0, currentStock + newQty);
                p.value = Math.max(0, currentValue + newTotal);
                p.cost = p.stock > 0 ? p.value / p.stock : newPrice;
            }

            // Обновляем саму запись в истории
            item.qty = newQty;
            item.price = newPrice;
            item.total = newQty * newPrice;
            item.date = newDate;

            saveData();
            renderHistory();
            closeModal();
            showToast('Закупка обновлена');
        }

        function deletePurchase(id) {
            const index = data.history.findIndex(h => h.id === id);
            if (index === -1) return;
            const item = data.history[index];

            showConfirm('Отмена закупки', `Удалить закупку детали "${item.partName}" от ${item.date}?\nОстатки на складе уменьшатся.`, () => {
                const p = getPart(item.partId);
                if (p) {
                    p.stock = Math.max(0, parseNum(p.stock) - parseNum(item.qty));
                    p.value = Math.max(0, parseNum(p.value) - parseNum(item.total));
                    p.cost = p.stock > 0 ? p.value / p.stock : (p.cost || 0);
                }
                data.history.splice(index, 1);
                saveData();
                renderHistory();
                showToast('Закупка отменена');
            });
        }

        function deleteBuild(id) {
            const index = data.history.findIndex(h => h.id === id);
            if (index === -1) return;
            const item = data.history[index];

            showConfirm('Отмена сборки', `Отменить сборку "${item.setName}" (${item.qty} шт) от ${item.date}?\nСписанные комплектующие вернутся на склад.`, () => {
                if(item.snapshots) {
                    item.snapshots.forEach(snap => {
                        const p = getPart(snap.partId);
                        if (p) {
                            p.stock = parseNum(p.stock) + snap.qtyTotal;
                            p.value = parseNum(p.value) + snap.lineCost;
                            p.cost = p.stock > 0 ? p.value / p.stock : p.cost;
                        }
                    });
                }
                data.history.splice(index, 1);
                saveData();
                renderHistory();
                showToast('Сборка отменена');
            });
        }

        // ==========================================
        // ОБНОВЛЕННЫЙ РЕНДЕР ИСТОРИИ
        // ==========================================
        function renderHistory() {
            const filtered = data.history.filter(h => historyFilter === 'all' || h.type === historyFilter).sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
            document.getElementById('tab-history').innerHTML = `
                <div class="space-y-4 max-w-4xl mx-auto">
                    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                        ${[{ id: 'all', label: 'Все операции' }, { id: 'purchase', label: 'Закупки' }, { id: 'build', label: 'Сборки' }].map(f => `<button onclick="historyFilter='${f.id}';renderHistory()" class="px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-colors ${historyFilter === f.id ? 'bg-slate-800 text-white' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}">${f.label}</button>`).join('')}
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        ${filtered.length === 0 ? `<div class="py-12 text-center text-slate-500">История пуста.</div>` : `<div class="divide-y divide-slate-100">${filtered.map(item => {
                            
                            if (item.type === 'purchase') {
                                return `
                                <div class="p-4 hover:bg-slate-50 flex flex-col sm:flex-row justify-between gap-4">
                                    <div class="flex items-start gap-4">
                                        <div class="p-3 bg-emerald-100 text-emerald-600 rounded-xl shrink-0"><i class="ph-bold ph-trend-up text-xl"></i></div>
                                        <div>
                                            <div class="text-xs font-bold text-slate-400">${item.date}</div>
                                            <div class="font-bold text-slate-800">Поступление: ${escapeHTML(item.partName)}</div>
                                            <div class="text-sm text-slate-600">+ ${formatQty(item.qty)} по ${formatMoney(item.price)}</div>
                                        </div>
                                    </div>
                                    <div class="flex flex-col items-start sm:items-end gap-2 shrink-0">
                                        <div class="font-bold text-emerald-600 text-lg">+${formatMoney(item.total)}</div>
                                        <div class="flex gap-2">
                                            <button onclick="editPurchase('${item.id}')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition-colors"><i class="ph-bold ph-pencil-simple mr-1"></i>Изменить</button>
                                            <button onclick="deletePurchase('${item.id}')" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold rounded-lg transition-colors"><i class="ph-bold ph-trash mr-1"></i>Отменить</button>
                                        </div>
                                    </div>
                                </div>`;
                            }
                            
                            if (item.type === 'build') {
                                return `
                                <div class="p-4 hover:bg-slate-50 flex flex-col sm:flex-row justify-between gap-4">
                                    <div class="flex items-start gap-4">
                                        <div class="p-3 bg-orange-100 text-orange-600 rounded-xl shrink-0"><i class="ph-bold ph-wrench text-xl"></i></div>
                                        <div>
                                            <div class="text-xs font-bold text-slate-400">${item.date}</div>
                                            <div class="font-bold text-slate-800">Сборка: ${escapeHTML(item.setName)}</div>
                                            <div class="text-sm text-slate-600">${formatQty(item.qty)} шт. (по ${formatMoney(item.unitCost)})</div>
                                        </div>
                                    </div>
                                    <div class="flex flex-col items-start sm:items-end gap-2 shrink-0">
                                        <div class="font-bold text-orange-600 text-lg">-${formatMoney(item.total)}</div>
                                        <button onclick="deleteBuild('${item.id}')" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold rounded-lg transition-colors"><i class="ph-bold ph-trash mr-1"></i>Отменить сборку</button>
                                    </div>
                                </div>`;
                            }

                            return '';
                        }).join('')}</div>`}
                    </div>
                </div>
            `;
        }

        function renderSettings() {
            document.getElementById('tab-settings').innerHTML = `
                <div class="max-w-2xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex justify-between gap-4"><div><h3 class="text-lg font-bold text-slate-800">Резервная копия</h3><p class="text-sm text-slate-500">Скачать файл JSON</p></div><button onclick="exportData()" class="bg-blue-50 text-blue-700 px-5 py-3 rounded-xl font-bold"><i class="ph-bold ph-download-simple text-xl"></i> Скачать</button></div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex justify-between gap-4"><div><h3 class="text-lg font-bold text-slate-800">Восстановить</h3><p class="text-sm text-slate-500">Загрузить файл JSON</p></div><label class="bg-slate-100 text-slate-700 px-5 py-3 rounded-xl font-bold cursor-pointer"><i class="ph-bold ph-upload-simple text-xl"></i> Загрузить<input type="file" accept=".json" onchange="importData(event)" class="hidden" /></label></div>
                    <div class="bg-red-50 p-6 rounded-3xl border border-red-100 flex justify-between gap-4 mt-12"><div><h3 class="text-lg font-bold text-red-800">Сброс</h3></div><button onclick="clearAllData()" class="bg-red-600 text-white px-5 py-3 rounded-xl font-bold"><i class="ph-bold ph-trash text-xl"></i> Очистить всё</button></div>
                </div>
            `;
        }

        function exportData() { const blob = new Blob([JSON.stringify({ app: 'Учёт v2', data }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup-${getToday()}.json`; a.click(); showToast('Скачано'); setNeedsBackup(false); }
        function importData(e) { const reader = new FileReader(); reader.onload = () => { try { const d = JSON.parse(reader.result).data || JSON.parse(reader.result); data = { parts: d.parts || [], sets: d.sets || [], history: d.history || [] }; saveData(); switchTab('home'); showToast('Восстановлено'); setNeedsBackup(false); } catch(err) { showToast('Ошибка импорта'); } }; reader.readAsText(e.target.files[0]); e.target.value = ''; }
        function clearAllData() { showConfirm('Очистка', 'Удалить всё?', () => { data = { parts: [], sets: [], history: [] }; saveData(); renderSettings(); showToast('Удалено'); setNeedsBackup(false); }); }

        document.addEventListener('DOMContentLoaded', () => { 
            loadData(); 
            switchTab('home'); 
            if (needsBackup) setNeedsBackup(true); 
        });
    </script>
</body>
</html>
